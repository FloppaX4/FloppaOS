<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloppaOS - Próximamente</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 50px 20px 20px;
        }

        header h1 {
            font-size: 3rem;
            color: #ffffff;
            margin: 0 0 10px 0;
        }

        header p {
            font-size: 1.2rem;
            color: #8b949e;
            margin: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .card h2 {
            color: #ffffff;
            margin-top: 0;
            font-size: 1.8rem;
        }

        .card > p {
            color: #8b949e;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .specs-grid {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin: 30px 0;
            text-align: left;
        }

        .spec-box {
            background: #0d1117;
            border: 1px solid #30363d;
            padding: 20px;
            border-radius: 8px;
            flex: 1;
        }

        .spec-box h4 {
            color: #8b949e;
            font-size: 0.85rem;
            text-transform: uppercase;
            margin: 0 0 8px 0;
        }

        .spec-box p {
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: bold;
            margin: 0;
        }

        .btn {
            background-color: #238636;
            color: white;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.2s;
            box-shadow: none;
        }

        .btn:hover {
            background-color: #2ea043;
        }
    </style>
</head>
<body>

    <header>
        <h1>FloppaOS</h1>
        <p>Rapido, Ligero y Facil de usar</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>Descarga FloppaOS</h2>
            <p>Usa FloppaOS para todo</p>
            
            <div class="specs-grid">
                <div class="spec-box">
                    <h4>Tamaño de ISO</h4>
                    <p>No informacion</p>
                </div>
                <div class="spec-box">
                    <h4>Requisitos</h4>
                    <p>No informacion</p>
                </div>
            </div>

            <a href="#" class="btn">PROXIMO</a>
        </div>
    </div>

</body>
</html>
