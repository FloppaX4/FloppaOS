<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloppaOS - Próximamente</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111722;
            --card-border: #232d3f;
            --accent-color: #2ea043;
            --accent-glow: rgba(46, 160, 67, 0.35);
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 20%, rgba(35, 134, 54, 0.08) 0%, transparent 60%);
        }

        header {
            text-align: center;
            padding: 70px 20px 20px;
        }

        .title {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            background: linear-gradient(180deg, #ffffff 0%, #a3b3c9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 1.25rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
        }

        /* Tarjeta principal con efecto de brillo */
        .card-wrapper {
            position: relative;
        }

        .card-wrapper::before {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 100%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            filter: blur(40px);
            z-index: 0;
            opacity: 0.6;
        }

        .card {
            position: relative;
            z-index: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 48px 40px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            border-color: #384559;
            transform: translateY(-2px);
        }

        .card h2 {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 32px;
        }

        /* Especificaciones */
        .specs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 36px;
        }

        .spec-box {
            background-color: rgba(9, 13, 22, 0.6);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 12px;
            text-align: left;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .spec-box:hover {
            border-color: #384559;
            background-color: rgba(17, 23, 34, 0.9);
        }

        .spec-header {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .spec-header svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .spec-value {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Botón principal */
        .btn {
            background: linear-gradient(180deg, #2ea043 0%, #238636 100%);
            color: #ffffff;
            padding: 16px 44px;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        .btn:hover {
            background: linear-gradient(180deg, #34b34b 0%, #2ea043 100%);
            box-shadow: 0 6px 20px rgba(46, 160, 67, 0.5);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 8px var(--accent-glow);
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid rgba(35, 45, 63, 0.4);
        }

        /* Adaptabilidad para teléfonos */
        @media (max-width: 640px) {
            .title { font-size: 2.8rem; }
            .specs-grid { grid-template-columns: 1fr; }
            .card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <header>
        <h1 class="title">FloppaOS</h1>
        <p class="subtitle">Rápido • Ligero • Fácil de usar</p>
    </header>

    <div class="container">
        <div class="card-wrapper">
            <main class="card">
                <h2>Obtén FloppaOS</h2>
                <p class="card-desc">Sistema Operativo para tu computadora</p>
                
                <div class="specs-grid">
                    <div class="spec-box">
                        <div class="spec-header">
                            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                            Tamaño de ISO
                        </div>
                        <div class="spec-value">Por determinar</div>
                    </div>
                    <div class="spec-box">
                        <div class="spec-header">
                            <svg viewBox="0 0 24 24"><path d="M22 9V7h-2V5c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-2h2v-2h-2v-2h2v-2h-2V9h2zm-4 10H4V5h14v14z"/></svg>
                            Requisitos
                        </div>
                        <div class="spec-value">Por determinar</div>
                    </div>
                </div>

                <a href="#" class="btn">PRÓXIMAMENTE</a>
            </main>
        </div>
    </div>

    <footer>
        <p>&copy; FloppaOS Project. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
